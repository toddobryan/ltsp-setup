[project]
name = "ltsp-setup"
version = "0.2.0"
description = "Scripts to set up an LTSP server and clients on a fresh Linux Mint install"
authors = [{ name = "Todd O'Bryan", email = "toddobryan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["typer (>=0.17.4,<0.18.0)", "rich (>=14.1.0,<15.0.0)", "pyyaml (>=6.0,<7.0)"]

[project.scripts]
ltsp-setup = "ltsp_setup.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "ltsp_setup", from = "src" }]
include = [{ path = "src/ltsp_setup/data/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
mypy = "^1.17.1"
pytest = "^8.3.0"
types-pyyaml = "^6.0.12.20260815"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

# typer's decorators are untyped, so strict mode flags every command function
# as "untyped decorator makes function untyped". The functions themselves are
# annotated; only the decorator is the problem, so relax it just here.
[[tool.mypy.overrides]]
module = "ltsp_setup.main"
disallow_untyped_decorators = false

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
