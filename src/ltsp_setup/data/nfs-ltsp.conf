# Managed by ltsp-setup. Local edits will be overwritten.
#
# Overrides /etc/nfs.conf (see "man 5 nfs.conf", /etc/nfs.conf.d), which
# stays the package's own file.
#
# nfs-utils starts 8 server threads by default. Every thin client's /home
# and its root filesystem image both come over NFS, so during a class-wide
# login those 8 sit waiting on the /home disks while requests the page cache
# could answer at once queue behind them. A thread costs about one
# max_block_size (1MB) of memory.
[nfsd]
threads=$NFSD_THREADS
