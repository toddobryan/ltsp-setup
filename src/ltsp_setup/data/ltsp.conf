# Managed by ltsp-setup. Local edits will be overwritten.
#
# DEFAULT_IMAGE here is what "ltsp ipxe" bakes into the iPXE boot menu as
# the client's default choice. Without it, thin clients have no image to
# netboot into even after one has been built with "ltsp-setup image build".
[server]
DEFAULT_IMAGE="$DEFAULT_IMAGE"
# Milliseconds the iPXE menu waits before booting DEFAULT_IMAGE. -1 hides
# the menu altogether, so a client boots DEFAULT_IMAGE and nothing else --
# the menu's only effect otherwise is to let a student choose an image they
# should not be on. Note the order of menu entries is not controllable:
# `ltsp ipxe` sorts them ascending by name, so the newest build is last.
# The *default* is DEFAULT_IMAGE regardless of where it sits in that list.
MENU_TIMEOUT="$MENU_TIMEOUT"
# Uncomments the /home export in /etc/exports.d/ltsp-nfs.exports -- without
# this, FSTAB_HOME below has nothing to actually mount. See man ltsp-nfs.
NFS_HOME=1
# ltsp-nat.service does the NAT for thin clients instead. LTSP's own version
# silently skips it if anything else (libvirt) turned IP forwarding on first.
NAT=0

# Applied to LTSP clients (not the server) at boot.
[clients]
# Specify an /etc/fstab line for NFS home; note this is insecure
FSTAB_HOME="server:/home /home nfs defaults,nolock 0 0"
# Real class rosters run to hundreds of names -- a clickable greeter list
# of all of them is unusable, so log in by typing a username instead.
LIGHTDM_CONF="greeter-hide-users=true"
# Point each client's own CUPS at the server, so printing goes through the
# server's queue instead of expecting a printer local to each client.
POST_INIT_CUPS="echo 'ServerName $LTSP_ADDRESS' > /etc/cups/client.conf"
# Clients are print clients, not print servers -- mask their own local
# CUPS daemon so it doesn't run redundantly on every thin client.
POST_INIT_NOCUPSD="systemctl mask cups.service cups-browsed.service"
